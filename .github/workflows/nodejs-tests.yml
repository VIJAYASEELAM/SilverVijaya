name: CI - Tests

on:
  push:
    branches: [ main, add/my-task-revert ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and test
        run: |
          cd repo_src
          npm ci
          npm test
